# Netlify rebuilds the site on every commit, including the ones the CMS makes.
[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

# The editor is for Chiharu only, so keep it out of search results.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Basic hardening for everything else.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
