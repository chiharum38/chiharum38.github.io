<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{TITLE_PLAIN}} · Chiharu Mamiya</title>
<meta name="description" content="{{EXCERPT}}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F4EF;--cream2:#EDE9E1;--cream3:#E3DDD3;
  --ink:#1A1714;--ink2:#5C5650;--ink3:#9B948C;
  --sage:#4A7C6F;--sage-lt:#D4E8E2;
  --terra:#C4714A;--terra-lt:#F2DDD4;
  --sand:#B89E7E;--sand-lt:#EDE4D6;
  --sky:#4B7FA8;--sky-lt:#D5E6F2;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --r:16px;--r-sm:10px;--r-lg:24px;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--sage);text-decoration:none}
a:hover{text-decoration:underline}

nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--cream3);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:62px}
.nav-name{font-family:var(--serif);font-size:17px;color:var(--ink)}
.nav-name:hover{text-decoration:none;color:var(--ink)}
.nav-back{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--ink2);font-weight:500;transition:color .15s}
.nav-back:hover{color:var(--ink);text-decoration:none}

.hero{max-width:760px;margin:0 auto;padding:3.5rem 2.5rem 2rem}
.hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.9rem}
.hero h1{font-family:var(--serif);font-size:clamp(1.9rem,4.4vw,2.9rem);font-weight:400;line-height:1.18;color:var(--ink);margin-bottom:1.1rem;letter-spacing:-.015em}
.hero h1 em{color:var(--terra);font-style:italic}
.byline{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;font-size:12.5px;color:var(--ink3);padding-bottom:1.5rem;border-bottom:1px solid var(--cream3)}
.byline b{color:var(--ink2);font-weight:500}
.byline .dot{color:var(--cream3)}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.tag{font-size:12px;font-weight:500;padding:5px 13px;border-radius:100px;border:1px solid var(--cream3);color:var(--ink2);background:var(--cream)}
.tag.sage{background:var(--sage-lt);border-color:transparent;color:var(--sage)}
.tag.terra{background:var(--terra-lt);border-color:transparent;color:var(--terra)}
.tag.sky{background:var(--sky-lt);border-color:transparent;color:var(--sky)}

.source-box{background:white;border:1px solid var(--cream3);border-radius:var(--r);padding:1.25rem 1.5rem;margin-top:1.75rem;display:flex;gap:1.15rem;align-items:flex-start}
.source-icon{width:38px;height:38px;border-radius:var(--r-sm);background:var(--terra-lt);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.source-label{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:.3rem}
.source-title{font-size:14.5px;color:var(--ink);line-height:1.5;margin-bottom:.25rem}
.source-meta{font-size:12.5px;color:var(--ink3)}

.content{max-width:760px;margin:0 auto;padding:0 2.5rem 4rem}
.lede{font-size:17px;color:var(--ink);line-height:1.72;margin:2.5rem 0 1.5rem;font-family:var(--serif);font-weight:400}
.content h2{font-family:var(--serif);font-size:1.45rem;font-weight:400;color:var(--ink);margin:2.75rem 0 1rem;padding-bottom:.7rem;border-bottom:1px solid var(--cream3)}
.content p{color:var(--ink2);margin-bottom:1.05rem;font-size:15px;line-height:1.8}
.content p strong{color:var(--ink);font-weight:500}
.content ul{list-style:none;margin:0 0 1.35rem}
.content ul li{color:var(--ink2);font-size:15px;line-height:1.72;padding:.45rem 0 .45rem 1.15rem;position:relative;border-bottom:.5px solid var(--cream3)}
.content ul li:last-child{border-bottom:none}
.content ul li::before{content:'·';position:absolute;left:0;color:var(--terra);font-size:1.25rem;top:.1rem}
.content ul li strong{color:var(--ink);font-weight:500}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.85rem;margin:1.6rem 0 1.9rem}
.stat{background:white;border:1px solid var(--cream3);border-radius:var(--r-sm);padding:1rem 1.1rem}
.stat-num{font-family:var(--serif);font-size:1.65rem;color:var(--ink);line-height:1;margin-bottom:.35rem}
.stat-label{font-size:12px;color:var(--ink3);line-height:1.45}

.pull{background:var(--sage-lt);border-radius:var(--r);padding:1.5rem 1.75rem;margin:1.9rem 0}
.pull p{font-family:var(--serif);font-size:1.2rem;line-height:1.5;color:#2b4c44;margin:0}

.link-out{background:var(--cream2);border:1px solid var(--cream3);border-radius:var(--r);padding:1.35rem 1.5rem;margin:1.9rem 0}
.link-out-label{font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:.65rem}
.link-out ul li{border-bottom:none;padding:.28rem 0 .28rem 1.15rem;font-size:14px}

.footer-nav{margin-top:3rem;padding-top:1.75rem;border-top:1px solid var(--cream3);display:flex;flex-wrap:wrap;gap:.75rem}
.btn-solid{display:inline-flex;align-items:center;gap:.4rem;background:var(--ink);color:var(--cream);border:1.5px solid var(--ink);border-radius:100px;padding:.6rem 1.4rem;font-size:13px;font-weight:500;transition:background .15s}
.btn-solid:hover{background:var(--ink2);border-color:var(--ink2);color:var(--cream);text-decoration:none}
.btn-line{display:inline-flex;align-items:center;gap:.4rem;color:var(--ink);border:1.5px solid var(--cream3);border-radius:100px;padding:.6rem 1.4rem;font-size:13px;font-weight:500;transition:border-color .15s}
.btn-line:hover{border-color:var(--ink3);text-decoration:none}

footer{border-top:1px solid var(--cream3);padding:2rem 2.5rem;text-align:center;font-size:12.5px;color:var(--ink3);max-width:1000px;margin:0 auto}

@media(max-width:760px){
  nav{padding:0 1.25rem}
  .hero{padding:2.5rem 1.25rem 1.5rem}
  .content{padding:0 1.25rem 3rem}
  .source-box{flex-direction:column;gap:.85rem}
  .pull p{font-size:1.08rem}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-name">Chiharu Mamiya</a>
  <a href="../index.html#notes" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to notes
  </a>
</nav>

<div class="hero">
  <div class="hero-eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE_HTML}}</h1>
  <div class="byline">
    <b>Chiharu Mamiya</b><span class="dot">·</span><span>{{DATE_LONG}}</span>{{READING_TIME}}
  </div>
{{SOURCE_BLOCK}}
{{TAGS}}
</div>

<div class="content">
{{LEDE}}
{{STATS}}
{{BODY}}
{{READING_NEXT}}
  <div class="footer-nav">
{{SOURCE_BUTTON}}
    <a href="../index.html#notes" class="btn-line">All notes</a>
    <a href="../index.html#projects" class="btn-line">See the projects</a>
  </div>

</div>

<footer>
  <p>Chiharu Mamiya · Power Systems Engineer · KTH/KU Leuven SENSE MSc 2026 to 2028</p>
</footer>

</body>
</html>
