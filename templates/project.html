<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{TITLE_PLAIN}} · Chiharu Mamiya</title>
<meta name="description" content="{{DESC_PLAIN}}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F4EF;--cream2:#EDE9E1;--cream3:#E3DDD3;
  --ink:#1A1714;--ink2:#5C5650;--ink3:#9B948C;
  --sage:#4A7C6F;--sage-lt:#D4E8E2;
  --terra:#C4714A;--terra-lt:#F2DDD4;
  --sand:#B89E7E;--sand-lt:#EDE4D6;
  --sky:#4B7FA8;--sky-lt:#D5E6F2;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Inter',system-ui,-apple-system,sans-serif;
  --r:8px;--r-sm:6px;--r-lg:12px;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:var(--sage);text-decoration:none}
a:hover{text-decoration:underline}

nav{position:sticky;top:0;z-index:100;background:rgba(247,244,239,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.06);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:74px;max-width:1200px;margin:0 auto}
.nav-name{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.nav-name:hover{text-decoration:none;color:var(--ink)}
.nav-back{display:flex;align-items:center;gap:.5rem;font-size:13.5px;color:var(--ink2);font-weight:500;transition:color .15s}
.nav-back:hover{color:var(--ink);text-decoration:none}

.hero{max-width:820px;margin:0 auto;padding:4rem 2.5rem 2rem}
.hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:.9rem}
.hero h1{font-family:var(--display);font-size:clamp(2.2rem,4.8vw,3.4rem);font-weight:500;line-height:1.04;color:var(--ink);margin-bottom:1.3rem;letter-spacing:-.035em}
.hero h1 em{color:var(--terra);font-style:normal}
.hero-desc{font-size:17px;color:var(--ink2);line-height:1.7;max-width:640px;margin-bottom:1.5rem;font-family:var(--serif);font-size:20px}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.tag{font-size:12px;font-weight:500;padding:5px 13px;border-radius:100px;border:1px solid var(--cream3);color:var(--ink2);background:var(--cream)}
.tag.sage{background:var(--sage-lt);border-color:transparent;color:var(--sage)}
.tag.terra{background:var(--terra-lt);border-color:transparent;color:var(--terra)}
.tag.sky{background:var(--sky-lt);border-color:transparent;color:var(--sky)}
.hero-img{width:100%;max-height:420px;object-fit:cover;border-radius:var(--r-lg);border:1px solid var(--cream3);display:block;margin-top:2rem}

.content{max-width:820px;margin:0 auto;padding:0 2.5rem 5rem}
.content h2{font-family:var(--display);font-size:1.6rem;font-weight:500;letter-spacing:-.028em;color:var(--ink);margin:3rem 0 1.1rem;padding-bottom:.75rem;border-bottom:1px solid var(--cream3)}
.content p{color:var(--ink2);margin-bottom:1.15rem;font-size:18px;line-height:1.72;font-family:var(--serif)}
.content p strong{color:var(--ink);font-weight:500}
.content ul{list-style:none;margin:0 0 1.35rem}
.content ul li{color:var(--ink2);font-size:17px;line-height:1.62;padding:.55rem 0 .55rem 1.2rem;position:relative;border-bottom:.5px solid var(--cream3);font-family:var(--serif)}
.content ul li:last-child{border-bottom:none}
.content ul li::before{content:'·';position:absolute;left:0;color:var(--terra);font-size:1.25rem;top:.1rem}
.content ul li strong{color:var(--ink);font-weight:500}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem;margin:1.75rem 0 2.1rem;align-items:stretch}
.stat{background:white;border:1px solid var(--cream3);border-radius:8px;padding:1.15rem 1.25rem;display:flex;flex-direction:column}
.stat-num{font-family:var(--display);font-size:1.85rem;font-weight:500;letter-spacing:-.03em;color:var(--ink);line-height:1;margin-bottom:.4rem}
.stat-label{font-size:13px;color:var(--ink3);line-height:1.4}

.pull{background:var(--sage-lt);border-radius:8px;padding:1.5rem 1.75rem;margin:1.9rem 0}
.pull p{font-family:var(--serif);font-size:1.45rem;line-height:1.42;color:#2b4c44;margin:0;letter-spacing:-.01em}

.pub-card{background:var(--sage-lt);border-radius:8px;padding:1.1rem 1.4rem;margin:1.9rem 0;font-size:14px;color:#2b4c44}
.pub-card a{color:var(--sage);font-weight:500}

.footer-nav{margin-top:3rem;padding-top:1.75rem;border-top:1px solid var(--cream3);display:flex;flex-wrap:wrap;gap:.75rem}
.btn-line{display:inline-flex;align-items:center;gap:.4rem;color:var(--ink);border:1.5px solid var(--cream3);border-radius:100px;padding:.6rem 1.4rem;font-size:13px;font-weight:500;transition:border-color .15s}
.btn-line:hover{border-color:var(--ink3);text-decoration:none}

footer{border-top:1px solid var(--cream3);padding:2rem 2.5rem;text-align:center;font-size:12.5px;color:var(--ink3);max-width:1000px;margin:0 auto}

@media(max-width:760px){
  nav{padding:0 1.25rem}
  .hero{padding:2.5rem 1.25rem 1.5rem}
  .content{padding:0 1.25rem 3rem}
  .pull p{font-size:1.08rem}
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-name">Chiharu Mamiya</a>
  <a href="../index.html#earlier" class="nav-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to projects
  </a>
</nav>

<div class="hero">
  <div class="hero-eyebrow">{{EYEBROW}}</div>
  <h1>{{TITLE_HTML}}</h1>
{{DESC}}
{{TAGS}}
{{HERO_IMAGE}}
</div>

<div class="content">
{{STATS}}
{{BODY}}
{{PUBLICATION}}
  <div class="footer-nav">
    <a href="../index.html#earlier" class="btn-line">All earlier projects</a>
    <a href="../index.html#projects" class="btn-line">Grid engineering projects</a>
  </div>
</div>

<footer>
  <p>Chiharu Mamiya · Power Systems Engineer · KTH/KU Leuven SENSE MSc 2026 to 2028</p>
</footer>

</body>
</html>
